
bundle:
  name: retailrocket-etl

resources:
  jobs:
    retailrocket-etl-job:
      name: retailrocket ETL
      tasks:
        - task_key: bronze_to_silver
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
            autotermination_minutes: 15
          notebook_task:
            notebook_path: ./04-etl/etl-bronze-to-silver
        - task_key: silver_to_gold
          depends_on: [{ task_key: bronze_to_silver }]
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
            autotermination_minutes: 15
          notebook_task:
            notebook_path: ./04-etl/etl-silver-to-gold
        - task_key: quality_checks
          depends_on: [{ task_key: silver_to_gold }]
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 0
            autotermination_minutes: 15
          notebook_task:
            notebook_path: ./04-etl/etl-verification-checks

targets:
  dev:
    variables:
      schema: retailrocket_dev
  prod:
    variables:
      schema: retailrocket